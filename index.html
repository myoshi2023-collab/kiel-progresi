<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>タイトル</title>

<style>
body {
    font-family: sans-serif;
    margin: 30px;
    line-height: 1.8;
}

h1 {
    font-size: 28px;
}

.esperanto {
    font-size: 22px;
}

.japana {
    font-size: 20px;
}
</style>

</head>

<body>

<h1>タイトルをここに入れる</h1>


<!-- 音声 -->
<h2>音声</h2>

<audio controls>
    <source src="音声ファイル名.mp3" type="audio/mpeg">
    お使いのブラウザは音声再生に対応していません。
</audio>




<!-- 画像 -->
<h2>画像</h2>

<img src="画像ファイル名.png" width="600">


<!-- エスペラント文 -->
<h2>Esperanto</h2>

<p class="esperanto">
ここにエスペラント文を入れます。
</p>


<!-- 日本語文 -->
<h2>日本語</h2>

<p class="japana">
ここに日本語訳を入れます。
</p>


</body>
</html>
